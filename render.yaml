services:
  - type: web
    name: diode-sentinel-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt -r requirements-ml.txt"
    startCommand: "python -m dashboard --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DIODE_CORS_ORIGINS
        sync: false
      - key: DIODE_DASHBOARD_MODE
        value: "live"
