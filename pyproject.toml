[project]
name = "diode-sentinel"
version = "2.4.0"
description = "Diode-Sentinel: Unidirectional Network Threat Detection Engine & Operations Center"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "scapy>=2.5.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
]

[tool.vercel]
entrypoint = "dashboard.server:app"
